name: Build TicTacToe APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          wget

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Setup Android SDK
      run: |
        # ایجاد پوشه‌های مورد نیاز
        mkdir -p ~/.android
        echo "### User Sources for Android SDK Manager" > ~/.android/repositories.cfg
        
        # نصب Command Line Tools
        cd ~
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        mv cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        
        # تنظیم مسیر
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        
        # پذیرش لایسنس‌ها
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        # نصب Build-Tools و Platform
        sdkmanager "build-tools;30.0.3" "platforms;android-30" > /dev/null 2>&1 || true

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TicTacToe-APK
        path: bin/*.apk
        retention-days: 30
